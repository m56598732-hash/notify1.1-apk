name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
      - 'apk-distribution/app-debug.apk.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Precompiled APK & Checksum
        run: |
          set -e
          echo "Validating APK distribution files..."

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file $APK_PATH not found."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file $APK_PATH is empty."
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "::error::Checksum file $SHA_PATH not found."
            exit 1
          fi

          # Verify SHA-256 matches
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256
          cd ..

          # Verify valid ZIP structure
          unzip -tq "$APK_PATH"

          echo "APK verification successful."

      - name: Create GitHub Release and Upload APK Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          REPO_NAME="${{ github.repository }}"

          echo "Creating GitHub Release with tag: $TAG"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "Automated release of precompiled Android debug APK.
- APK Size: $APK_SIZE
- SHA-256: \`$APK_SHA\`
- Application ID: \`com.aistudio.notify.ntfyx\`" \
            --latest

          RELEASE_URL="https://github.com/$REPO_NAME/releases/tag/$TAG"
          DOWNLOAD_URL="https://github.com/$REPO_NAME/releases/latest/download/app-debug.apk"

          echo "Release published: $RELEASE_URL"
          echo "Direct download: $DOWNLOAD_URL"

          # Job summary report
          echo "### APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256**: \`$APK_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page**: [$TAG]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download**: [Download app-debug.apk]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
